<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Software team at work</title>
  <desc id="d">A code editor and a design preview side by side, a shipped-release badge and a row of team avatars.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6A6CEF" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B7DF3"/>
      <stop offset="1" stop-color="#5557E0"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEDFD"/>
      <stop offset="1" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>

  <!-- soft background shapes -->
  <circle cx="690" cy="95" r="120" fill="#D8B4FE" opacity="0.28"/>
  <circle cx="90" cy="520" r="110" fill="#6A6CEF" opacity="0.10"/>

  <!-- code editor window -->
  <g filter="url(#sh)">
    <rect x="48" y="70" width="470" height="330" rx="18" fill="#fff"/>
  </g>
  <rect x="48" y="70" width="470" height="44" rx="18" fill="#F4F4FB"/>
  <rect x="48" y="96" width="470" height="18" fill="#F4F4FB"/>
  <circle cx="76" cy="92" r="6" fill="#FF6B6B"/>
  <circle cx="98" cy="92" r="6" fill="#FFD166"/>
  <circle cx="120" cy="92" r="6" fill="#4ADE80"/>
  <rect x="160" y="84" width="120" height="16" rx="8" fill="#E4E4F4"/>
  <!-- sidebar -->
  <rect x="48" y="114" width="64" height="286" fill="#FAFAFE"/>
  <rect x="64" y="136" width="32" height="8" rx="4" fill="#C9CAF9"/>
  <rect x="64" y="162" width="26" height="8" rx="4" fill="#E4E4F4"/>
  <rect x="64" y="188" width="30" height="8" rx="4" fill="#E4E4F4"/>
  <rect x="64" y="214" width="22" height="8" rx="4" fill="#E4E4F4"/>
  <rect x="64" y="240" width="28" height="8" rx="4" fill="#E4E4F4"/>
  <!-- code lines -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#B5B7D6">
    <text x="128" y="146">1</text><text x="128" y="172">2</text><text x="128" y="198">3</text>
    <text x="128" y="224">4</text><text x="128" y="250">5</text><text x="128" y="276">6</text>
    <text x="128" y="302">7</text><text x="128" y="328">8</text><text x="128" y="354">9</text>
  </g>
  <rect x="152" y="136" width="70" height="10" rx="5" fill="#6A6CEF"/>
  <rect x="230" y="136" width="110" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="168" y="162" width="96" height="10" rx="5" fill="#C084FC"/>
  <rect x="272" y="162" width="130" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="168" y="188" width="60" height="10" rx="5" fill="#6A6CEF"/>
  <rect x="236" y="188" width="150" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="184" y="214" width="120" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="312" y="214" width="70" height="10" rx="5" fill="#4ADE80" opacity="0.8"/>
  <rect x="184" y="240" width="84" height="10" rx="5" fill="#C084FC"/>
  <rect x="276" y="240" width="100" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="168" y="266" width="40" height="10" rx="5" fill="#6A6CEF"/>
  <rect x="152" y="292" width="90" height="10" rx="5" fill="#6A6CEF"/>
  <rect x="250" y="292" width="140" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="168" y="318" width="110" height="10" rx="5" fill="#CFCFE6"/>
  <rect x="152" y="344" width="52" height="10" rx="5" fill="#6A6CEF"/>
  <!-- editor caret -->
  <rect x="212" y="341" width="2.5" height="16" fill="#5557E0"/>

  <!-- design preview card -->
  <g filter="url(#sh)">
    <rect x="410" y="250" width="320" height="250" rx="18" fill="#fff"/>
  </g>
  <rect x="430" y="270" width="280" height="96" rx="12" fill="url(#soft)"/>
  <path d="M570 288l26 46h-52l26-46z" fill="url(#brand)" opacity="0.9"/>
  <circle cx="570" cy="321" r="6" fill="#fff"/>
  <rect x="430" y="382" width="150" height="12" rx="6" fill="#0B0B0B" opacity="0.85"/>
  <rect x="430" y="404" width="230" height="8" rx="4" fill="#D9D9EA"/>
  <rect x="430" y="420" width="190" height="8" rx="4" fill="#D9D9EA"/>
  <rect x="430" y="446" width="104" height="34" rx="17" fill="url(#brand)"/>
  <rect x="448" y="460" width="68" height="7" rx="3.5" fill="#fff" opacity="0.9"/>
  <rect x="544" y="446" width="84" height="34" rx="17" fill="#fff" stroke="#DADAF0"/>
  <!-- mini bars -->
  <g opacity="0.95">
    <rect x="640" y="446" width="12" height="34" rx="3" fill="#D8B4FE"/>
    <rect x="658" y="432" width="12" height="48" rx="3" fill="#6A6CEF"/>
    <rect x="676" y="454" width="12" height="26" rx="3" fill="#D8B4FE"/>
    <rect x="694" y="438" width="12" height="42" rx="3" fill="#6A6CEF"/>
  </g>

  <!-- shipped badge -->
  <g filter="url(#sh)">
    <rect x="70" y="430" width="200" height="56" rx="28" fill="#fff"/>
  </g>
  <circle cx="102" cy="458" r="16" fill="#4ADE80"/>
  <path d="M94 458l6 6 11-12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="130" y="444" width="86" height="10" rx="5" fill="#0B0B0B" opacity="0.85"/>
  <rect x="130" y="462" width="124" height="8" rx="4" fill="#D9D9EA"/>

  <!-- team avatars -->
  <g filter="url(#sh)">
    <rect x="552" y="58" width="196" height="68" rx="34" fill="#fff"/>
  </g>
  <g>
    <circle cx="590" cy="92" r="22" fill="#E0E0FB"/>
    <circle cx="590" cy="86" r="8" fill="#6A6CEF"/>
    <path d="M574 108c2-9 9-12 16-12s14 3 16 12" fill="#6A6CEF"/>
    <circle cx="636" cy="92" r="22" fill="#F3E8FF" stroke="#fff" stroke-width="3"/>
    <circle cx="636" cy="86" r="8" fill="#A855F7"/>
    <path d="M620 108c2-9 9-12 16-12s14 3 16 12" fill="#A855F7"/>
    <circle cx="682" cy="92" r="22" fill="#DCFCE7" stroke="#fff" stroke-width="3"/>
    <circle cx="682" cy="86" r="8" fill="#22C55E"/>
    <path d="M666 108c2-9 9-12 16-12s14 3 16 12" fill="#22C55E"/>
    <circle cx="720" cy="102" r="6" fill="#4ADE80" stroke="#fff" stroke-width="2.5"/>
  </g>

  <!-- decorative marks -->
  <path d="M742 190l16 28h-32l16-28z" fill="#6A6CEF" opacity="0.25"/>
  <circle cx="40" cy="300" r="7" fill="#D8B4FE"/>
  <circle cx="760" cy="540" r="9" fill="#6A6CEF" opacity="0.3"/>
  <circle cx="300" cy="540" r="5" fill="#D8B4FE"/>
</svg>
