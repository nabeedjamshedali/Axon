name: CI/CD - build, push to ECR, deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 526295688414.dkr.ecr.ap-south-1.amazonaws.com
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::526295688414:role/axon-github-deploy' }}
  WEB_ASG: axon-web-asg
  APP_ASG: axon-app-asg
  PUBLIC_ALB: axon-public-alb 

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Site tests + build
        run: |
          npm ci
          npm test
          npm run build
      - name: API tests
        working-directory: api
        run: |
          npm ci
          npm test

  build-and-deploy:
    name: Build, push, deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-production # never run two deployments at once
    permissions:
      id-token: write # request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          SHA="${GITHUB_SHA::7}"
          docker build -f web/Dockerfile -t "$ECR_REGISTRY/axon-web:$SHA" -t "$ECR_REGISTRY/axon-web:latest" .
          docker build --build-arg GIT_SHA="$SHA" -t "$ECR_REGISTRY/axon-api:$SHA" -t "$ECR_REGISTRY/axon-api:latest" api
          for r in web api; do
            docker push "$ECR_REGISTRY/axon-$r:$SHA"
            docker push "$ECR_REGISTRY/axon-$r:latest"
          done

      - name: Roll out to Auto Scaling groups (rolling instance refresh)
        run: |
          for asg in "$APP_ASG" "$WEB_ASG"; do
            # A refresh left running by an earlier (cancelled) deploy would block this one and roll out an
            # older :latest, so cancel it and let the newest commit win.
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" \
              --query 'InstanceRefreshes[0].Status' --output text)
            if [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ]; then
              echo "$asg: cancelling refresh left over from an earlier deploy"
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$asg"
            fi
            for i in $(seq 1 40); do
              STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" \
                --query 'InstanceRefreshes[0].Status' --output text)
              case "$STATUS" in Pending|InProgress|Cancelling) sleep 15 ;; *) break ;; esac
            done
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$asg" \
              --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}'
          done

      - name: Wait for rollout to finish
        run: |
          for asg in "$APP_ASG" "$WEB_ASG"; do
            for i in $(seq 1 60); do
              STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" \
                --query 'InstanceRefreshes[0].Status' --output text)
              echo "$asg refresh: $STATUS"
              case "$STATUS" in
                Successful) break ;;
                Failed|Cancelled|RollbackSuccessful|RollbackFailed) echo "::error::$asg refresh $STATUS"; exit 1 ;;
              esac
              sleep 30
            done
            [ "$STATUS" = "Successful" ] || { echo "::error::timed out waiting for $asg"; exit 1; }
          done

      - name: Smoke test the public endpoint
        run: |
          APP_URL="http://$(aws elbv2 describe-load-balancers --names "$PUBLIC_ALB" --query 'LoadBalancers[0].DNSName' --output text)"
          echo "Smoke testing $APP_URL"
          curl -fsS --retry 5 --retry-delay 10 "${APP_URL}/healthz"
          curl -fsS --retry 5 --retry-delay 10 "${APP_URL}/api/health"
